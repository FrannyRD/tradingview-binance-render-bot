<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trading Bot Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --ink: #18202f;
        --muted: #647086;
        --line: #dfe5ef;
        --good: #0f8f5f;
        --bad: #c2413a;
        --warn: #b56a00;
        --accent: #2454d6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 24px clamp(16px, 4vw, 48px);
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      h1 { margin: 0; font-size: 22px; line-height: 1.2; }
      main { padding: 24px clamp(16px, 4vw, 48px); }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 20px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }
      .metric-label { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
      .metric-value { font-size: 24px; font-weight: 750; }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 13px;
        color: var(--muted);
        background: #fff;
      }
      .badge.good { color: var(--good); border-color: #b8e2d2; background: #eefaf5; }
      .badge.warn { color: var(--warn); border-color: #f0d6a8; background: #fff8e8; }
      .row {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 16px;
        align-items: start;
      }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 650; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        background: #eef2f8;
        padding: 2px 5px;
        border-radius: 4px;
      }
      button {
        border: 1px solid var(--line);
        background: #ffffff;
        border-radius: 6px;
        color: var(--ink);
        min-height: 36px;
        padding: 0 12px;
        font-weight: 650;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      .muted { color: var(--muted); }
      @media (max-width: 980px) {
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .row { grid-template-columns: 1fr; }
      }
      @media (max-width: 560px) {
        header { align-items: flex-start; flex-direction: column; }
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Trading Bot Dashboard</h1>
        <div class="muted">TradingView -> Render -> Binance Spot</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="scan">Escanear</button>
        <button id="refresh">Actualizar</button>
      </div>
    </header>
    <main>
      <section class="grid">
        <div class="panel">
          <div class="metric-label">Modo</div>
          <div class="metric-value" id="mode">-</div>
        </div>
        <div class="panel">
          <div class="metric-label">Trading</div>
          <div class="metric-value" id="tradeEnabled">-</div>
        </div>
        <div class="panel">
          <div class="metric-label">Equity USDT</div>
          <div class="metric-value" id="equity">-</div>
        </div>
        <div class="panel">
          <div class="metric-label">Operaciones abiertas</div>
          <div class="metric-value" id="openTrades">-</div>
        </div>
        <div class="panel">
          <div class="metric-label">Scanner</div>
          <div class="metric-value" id="scanner">-</div>
        </div>
      </section>

      <section class="row">
        <div class="panel">
          <h2>Eventos recientes</h2>
          <table>
            <thead>
              <tr>
                <th>Hora</th>
                <th>Tipo</th>
                <th>Detalle</th>
              </tr>
            </thead>
            <tbody id="events"></tbody>
          </table>
        </div>
        <div class="panel">
          <h2>Configuración activa</h2>
          <div id="config"></div>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
