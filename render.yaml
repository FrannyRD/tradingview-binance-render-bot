services:
  - type: web
    name: tradingview-binance-render-bot
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: "npm start"
    healthCheckPath: /health
    envVars:
      - key: BOT_MODE
        value: dry-run
      - key: TRADE_ENABLED
        value: "false"
      - key: WEBHOOK_SECRET
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: RISK_PER_TRADE_PCT
        value: "0.5"
      - key: MAX_DAILY_LOSS_PCT
        value: "3"
      - key: MAX_OPEN_TRADES
        value: "3"
      - key: MAX_DAILY_TRADES
        value: "6"
      - key: STARTING_EQUITY_USDT
        value: "1000"
      - key: ALLOWED_SYMBOLS
        value: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,LTCUSDT,DOTUSDT,TRXUSDT
      - key: LONG_ONLY
        value: "true"
      - key: REQUIRE_PROTECTIVE_ORDERS
        value: "true"
      - key: PROTECTIVE_ORDERS_ENABLED
        value: "true"
      - key: SCANNER_ENABLED
        value: "true"
      - key: SCANNER_SYMBOLS
        value: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,LTCUSDT,DOTUSDT,TRXUSDT
      - key: SCANNER_TIMEFRAME
        value: 1h
      - key: SCANNER_INTERVAL_SECONDS
        value: "300"
      - key: SCANNER_LOOKBACK
        value: "300"
      - key: SCANNER_USE_CLOSED_CANDLE
        value: "true"
      - key: SCANNER_RISK_REWARD
        value: "2"
      - key: SCANNER_MIN_RISK_REWARD
        value: "1.5"
      - key: SCANNER_ATR_LENGTH
        value: "14"
      - key: SCANNER_ATR_STOP_MULT
        value: "1.5"
